name: Windows trial
on:
  push:
    # Pass 22 (tonight build, part 3): the rekordbox-style branch
    # builds too, so the user can download tonight's exe from the
    # run's artifact without merging PR #8 first.
    branches: [main, muse/rekordbox-style-2]
  pull_request:
  workflow_dispatch:
jobs:
  test-build:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pytest==9.2.0 pyinstaller==6.22.3
      - run: python -m pytest -q
      - run: python make_demo.py demo
      - run: python build.py
      - name: Run packaged application smoke test
        timeout-minutes: 2
        shell: pwsh
        run: |
          $trial = Start-Process dist/MixAble/MixAble.exe -ArgumentList '--smoke-test', 'smoke' -WindowStyle Hidden -Wait -PassThru
          if ($trial.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
          if (-not (Test-Path smoke/smoke.json)) { throw 'Missing smoke result' }
      - run: python collect_licenses.py dist/MixAble/third-party-licenses
      - run: Copy-Item demo,*.md -Destination dist/MixAble -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: MixAble-Windows-x64
          path: dist/MixAble
      - uses: actions/upload-artifact@v4
        with:
          name: MixAble-smoke-evidence
          path: |
            smoke/smoke.json
            smoke/screenshot.png
